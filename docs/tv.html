<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tank Arena - Layar Utama</title>
  <style>
    html, body { margin: 0; height: 100%; background: #142019; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    #wrap { position: relative; filter: drop-shadow(0 8px 0 #0a100b); }
    canvas { background: #9bd477; display: block; max-width: 100vw; max-height: 100vh; border: 6px solid #17251c; border-radius: 18px; }
    #join { position: absolute; top: 16px; left: 16px; background: #fff4d6; color: #263126; border: 5px solid #252b25; padding: 11px; border-radius: 17px; text-align: center; width: 184px; box-shadow: 0 7px 0 #111a13; animation: lobby-bob 3s ease-in-out infinite; overflow: hidden; }
    #join::before, #join::after { content: ''; position: absolute; border-radius: 50%; z-index: -1; opacity: .7; animation: bubble 4s ease-in-out infinite alternate; }
    #join::before { width: 70px; height: 70px; background: #f1c40f; top: -35px; left: -25px; }
    #join::after { width: 55px; height: 55px; background: #e67e22; bottom: -30px; right: -20px; animation-delay: -2s; }
    #qr { background: #fff; padding: 5px; border: 3px solid #252b25; border-radius: 10px; width: 150px; height: 150px; image-rendering: pixelated; }
    #join .code { font-size: 17px; font-weight: 900; letter-spacing: 1px; margin-top: 6px; }
    #join .hint { font-size: 11px; color: #536052; margin-top: 4px; line-height: 1.3; font-weight: 700; }
    #loading { color: #2980b9; font-size: 12px; margin-top: 5px; font-weight: 800; }
    #scores { position: absolute; top: 16px; right: 16px; background: #fff4d6; color: #263126; border: 5px solid #252b25; padding: 10px 14px; border-radius: 17px; min-width: 190px; box-shadow: 0 7px 0 #111a13; }
    #scores h3 { margin: 0 0 6px; font-size: 14px; color: #e67e22; text-shadow: 1px 1px 0 #252b25; }
    #scores div { font-size: 14px; margin: 3px 0; font-weight: 800; }
    #notice { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); background: #f1c40f; color: #252b25; border: 4px solid #252b25; box-shadow: 0 5px 0 #111a13; padding: 7px 14px; border-radius: 14px; font-size: 14px; display: none; white-space: nowrap; font-weight: 900; }
    @keyframes lobby-bob { 0%, 100% { transform: rotate(-1deg) translateY(0); } 50% { transform: rotate(1deg) translateY(-6px); } }
    @keyframes bubble { from { transform: translate(0, 0) rotate(0); } to { transform: translate(25px, 12px) rotate(25deg); } }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1000" height="700"></canvas>
    <div id="join">
      <img id="qr" alt="QR controller HP" />
      <div class="code" id="code">Membuat room...</div>
      <div class="hint">Scan QR ini dengan HP.<br />Setiap HP menjadi satu tank.</div>
      <div id="loading">Menunggu koneksi PeerJS</div>
    </div>
    <div id="scores"><h3>Skor</h3><div id="score-list">Belum ada pemain</div></div>
    <div id="notice"></div>
  </div>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="vendor/qrcode-generator.js"></script>
  <script src="game.js"></script>
  <script src="tv.js"></script>
</body>
</html>
