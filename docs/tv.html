<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tank Arena - Layar Utama</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    #wrap { position: relative; }
    canvas { background: #1d2a1d; display: block; max-width: 100vw; max-height: 100vh; }
    #join { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,.78); padding: 10px; border-radius: 8px; text-align: center; width: 174px; }
    #qr { background: #fff; padding: 4px; border-radius: 6px; width: 150px; height: 150px; }
    #join .code { font-size: 18px; font-weight: bold; letter-spacing: 1px; margin-top: 6px; }
    #join .hint { font-size: 11px; color: #bbb; margin-top: 4px; line-height: 1.3; }
    #scores { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,.72); padding: 10px 14px; border-radius: 8px; min-width: 190px; }
    #scores h3 { margin: 0 0 6px; font-size: 14px; }
    #scores div { font-size: 14px; margin: 3px 0; }
    #notice { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.72); padding: 6px 12px; border-radius: 6px; font-size: 14px; display: none; white-space: nowrap; }
    #loading { color: #f1c40f; font-size: 12px; margin-top: 5px; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1000" height="700"></canvas>
    <div id="join">
      <img id="qr" alt="QR controller HP" />
      <div class="code" id="code">Membuat room...</div>
      <div class="hint">Scan QR ini dengan HP.<br />Setiap HP menjadi satu tank.</div>
      <div id="loading">Menunggu koneksi PeerJS</div>
    </div>
    <div id="scores"><h3>Skor</h3><div id="score-list">Belum ada pemain</div></div>
    <div id="notice"></div>
  </div>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <script src="game.js"></script>
  <script src="tv.js"></script>
</body>
</html>
