<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tank Arena - Layar Utama</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { overflow: hidden; }
    .layout { position: relative; z-index: 1; display: flex; gap: 22px; align-items: center; justify-content: center; height: 100%; padding: 22px; }
    .sidebar { width: 240px; flex: none; display: flex; flex-direction: column; gap: 24px; max-height: 100%; }
    @media (max-height: 820px) {
      .logo { display: none; }
      .sidebar { gap: 22px; padding-top: 10px; }
      #qr, .qr-placeholder { width: 140px !important; height: 140px !important; }
      .slot { min-height: 38px !important; padding: 5px 9px !important; }
    }
    .stage { position: relative; flex: 1; max-width: calc((100vh - 44px) * 1000 / 700); }
    .stage canvas { display: block; width: 100%; height: auto; border-radius: 26px; box-shadow: 0 8px 0 var(--ink), 0 22px 40px rgba(0,0,0,.3); }
    .stage .ov { border-radius: 26px; }

    .logo { font-size: 40px; text-align: center; }
    .join { padding: 30px 16px 16px; text-align: center; }
    .qr-wrap { position: relative; display: inline-block; padding: 8px; background: #fff; border: 4px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--ink); }
    .qr-wrap::before, .qr-wrap::after {
      content: ''; position: absolute; width: 26px; height: 26px; border: 5px solid var(--yellow); border-radius: 6px;
      animation: corner 1.4s ease-in-out infinite;
    }
    .qr-wrap::before { top: -12px; left: -12px; border-right: none; border-bottom: none; }
    .qr-wrap::after { bottom: -12px; right: -12px; border-left: none; border-top: none; }
    @keyframes corner { 50% { transform: scale(1.18); } }
    #qr { display: block; width: 170px; height: 170px; image-rendering: pixelated; border-radius: 8px; }
    .qr-placeholder { width: 170px; height: 170px; display: grid; place-items: center; font-size: 46px; animation: spin 1.2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .room { margin-top: 14px; font-size: 14px; font-weight: 700; }
    .room .badge { font-size: 13px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
    #loading { margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--blue-dark); }
    #room-link { margin-top: 6px; font-size: 10px; font-weight: 600; color: rgba(27,21,48,.55); word-break: break-all; }
    .room .badge { letter-spacing: 3px; font-size: 16px !important; }

    .slots { padding: 28px 12px 12px; display: grid; gap: 9px; }
    .slot {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      border: 3px dashed rgba(27,21,48,.35); border-radius: 14px; font-weight: 700; color: rgba(27,21,48,.5); min-height: 46px;
    }
    .slot .dot { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--ink); background: #ddd; flex: none; }
    .slot.filled { border: 3px solid var(--ink); background: #fff; color: var(--ink); box-shadow: 0 3px 0 var(--ink); animation: pop-in .4s cubic-bezier(.3,1.6,.5,1) both; }
    .slot.out { opacity: .5; }
    .slot .name { flex: 1; font-family: var(--font-title); font-size: 16px; letter-spacing: .5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .slot .stats { text-align: right; font-size: 12px; line-height: 1.2; }
    .slot .hearts { white-space: nowrap; }
    .slot .heart { width: 14px; height: 12px; }
    .waiting { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .45; } }

    #toast {
      position: fixed; top: 18px; left: 50%; z-index: 10; transform: translate(-50%, calc(-100% - 40px));
      transition: transform .35s cubic-bezier(.3,1.6,.5,1);
      font-family: var(--font-title); font-size: 20px; letter-spacing: .5px;
    }
    #toast.show { transform: translate(-50%, 0); }
    #toast .btn { width: auto; padding: 9px 18px; font-size: 18px; pointer-events: none; }

    @media (max-width: 860px) {
      .layout { flex-direction: column; overflow: auto; height: auto; min-height: 100%; }
      .sidebar { width: 100%; max-width: 420px; }
      .stage { width: 100%; max-width: none; }
    }

    /* Saat game berjalan (bukan lobby): hanya arena, memenuhi layar, tanpa panel QR/pemain. */
    body.playing.sky { background: #120c24; animation: none; }
    body.playing .clouds, body.playing .sidebar { display: none; }
    body.playing .layout { flex-direction: row; gap: 0; padding: 0; height: 100%; min-height: 0; overflow: hidden; }
    body.playing .stage { flex: none; width: min(100vw, calc(100vh * 1000 / 700)); max-width: none; }
    body.playing .stage canvas { border-radius: 0; box-shadow: none; }
    body.playing .stage .ov { border-radius: 0; }
  </style>
</head>
<body class="sky">
  <div class="clouds"><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div></div>

  <div class="layout">
    <aside class="sidebar">
      <h1 class="title logo wobble">TANK ARENA</h1>
      <section class="panel join">
        <div class="panel-header" id="join-header">SCAN UNTUK MAIN</div>
        <div class="qr-wrap bob">
          <img id="qr" alt="QR controller HP" hidden />
          <div class="qr-placeholder" id="qr-placeholder">⚙️</div>
        </div>
        <div class="room">Room <span class="badge" id="code">...</span></div>
        <div id="loading">Menyiapkan room...</div>
        <div class="net-status" style="margin-top:8px"><span class="chip wait" id="chip-rtc">Langsung: ...</span><span class="chip wait" id="chip-relay">Relay: ...</span></div>
        <div id="room-link"></div>
      </section>
      <section class="panel slots" id="slots">
        <div class="panel-header" style="background: var(--orange); box-shadow: inset 0 -4px 0 #c9621a, 0 4px 0 var(--ink);"><span id="mode-label">PEMAIN</span></div>
      </section>
      <div style="display:flex;gap:8px">
        <button class="btn" id="fs-btn" style="padding:8px 10px;font-size:15px">⛶ LAYAR PENUH</button>
        <a class="btn red" href="index.html" style="padding:8px 12px;font-size:15px">✖ MENU</a>
      </div>
    </aside>
    <main class="stage" id="stage">
      <canvas id="game" width="1000" height="700"></canvas>
    </main>
  </div>

  <div id="toast"><span class="btn yellow" id="toast-text"></span></div>

  <script src="vendor/peerjs.min.js"></script>
  <script src="vendor/mqtt.min.js"></script>
  <script src="vendor/qrcode-generator.js"></script>
  <script src="net.js"></script>
  <script src="maps.js"></script>
  <script src="game.js"></script>
  <script src="match.js"></script>
  <script src="mapart.js"></script>
  <script src="render.js"></script>
  <script src="overlay.js"></script>
  <script src="tv.js"></script>
</body>
</html>
