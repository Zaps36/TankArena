<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2f7de0" />
  <title>Tank Arena Controller</title>
  <link rel="stylesheet" href="style.css?v=20261127b" />
  <style>
    html, body { overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    :root { --me: var(--red); }

    #join { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; gap: 12px; padding: 20px; text-align: center; }
    #join .title { font-size: 44px; }
    .join-card { width: min(340px, 100%); padding: 32px 18px 18px; display: grid; gap: 12px; }
    .room-line { font-weight: 700; font-size: 15px; }
    .room-line .badge { font-size: 16px; letter-spacing: 3px; }
    #msg { min-height: 20px; font-weight: 700; font-size: 14px; color: var(--blue-dark); }
    #msg.error { color: var(--red-dark); }
    #join .mascot { transform: scale(.75); }
    @media (max-height: 520px) { #join .mascot, #join .mascot-shadow { display: none; } #join .title { font-size: 34px; } }

    #game { display: none; position: fixed; inset: 0; z-index: 1; }
    .topbar {
      position: absolute; top: calc(8px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 5;
      display: flex; align-items: center; gap: 9px; padding: 5px 10px 5px 5px;
      background: var(--cream); border: 4px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--ink); white-space: nowrap;
    }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--me); border: 4px solid var(--ink); box-shadow: inset 0 -4px 0 rgba(0,0,0,.2); }
    #me-name { font-family: var(--font-title); font-size: 17px; letter-spacing: .5px; }
    .hp { width: 80px; height: 14px; background: var(--ink); border-radius: 8px; padding: 2px; }
    #hp-fill { height: 100%; width: 100%; border-radius: 6px; background: var(--green); transition: width .2s, background .2s; }
    #pts { font-family: var(--font-title); font-size: 14px; padding: 1px 7px; background: var(--yellow); border: 2px solid var(--ink); border-radius: 8px; }
    #link { font-size: 10px; font-weight: 700; padding: 2px 5px; border: 2px solid var(--ink); border-radius: 7px; background: #c9f7d2; }
    #link.relay { background: #fff1b8; }
    #link.lost { background: #ffd0d5; }
    #round-pill { position: absolute; z-index: 5; top: calc(64px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font-family: var(--font-title); font-size: 14px; padding: 2px 10px; background: var(--ink); color: #fff; border-radius: 10px; white-space: nowrap; }
    #round-pill.hurry { background: var(--red); }

    /* Panel lobby kecil di atas: kontrol tetap bisa dipakai untuk latihan. */
    #lobby { position: absolute; z-index: 6; top: calc(64px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(330px, 70vw); padding: 26px 12px 10px; text-align: center; display: none; }
    #lobby p { margin: 0 0 6px; font-weight: 700; font-size: 13px; }
    #lobby .segs { display: flex; justify-content: center; gap: 6px; margin: 4px 0 8px; }
    #lobby .seg { width: 46px; height: 34px; font-family: var(--font-title); font-size: 17px; background: #fff; border: 3px solid var(--ink); border-radius: 10px; box-shadow: 0 3px 0 var(--ink); color: var(--ink); }
    #lobby .seg.on { background: var(--yellow); transform: translateY(-2px); }
    #lobby .btn { font-size: 18px; padding: 8px 12px; }
    #lobby-host { display: none; }

    /* Teks besar fase (RONDE, 3-2-1, GO!) - tidak menghalangi sentuhan. */
    #big { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; pointer-events: none; }
    #big span { font-family: var(--font-title); font-size: 30vmin; line-height: 1; color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 var(--ink); animation: count-pop .95s cubic-bezier(.3,1.8,.5,1) both; }
    #big span.go { color: var(--green); }
    #big span.small { font-size: 13vmin; color: var(--yellow); animation: title-pop .5s cubic-bezier(.3,1.8,.5,1) both; }

    #overlay { position: absolute; inset: 0; z-index: 7; display: none; place-items: center; background: rgba(27,21,48,.55); }
    #overlay .panel { padding: 28px 22px 18px; text-align: center; width: min(360px, 86vw); }
    #overlay .title { font-size: 42px; }
    #overlay p { margin: 6px 0; font-weight: 700; }
    #overlay .gain { display: inline-block; font-family: var(--font-title); font-size: 26px; color: #fff; background: var(--green); padding: 2px 12px; border: 3px solid var(--ink); border-radius: 12px; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; animation: gain-pop .5s cubic-bezier(.3,1.8,.5,1) .3s both; }
    #overlay .btns { display: none; gap: 8px; margin-top: 10px; }
    #overlay .btns .btn { font-size: 16px; padding: 8px; }
    #tip { position: absolute; z-index: 6; top: calc(96px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(420px, 80vw); padding: 6px 12px; text-align: center; font-weight: 700; font-size: 13px; color: var(--ink); background: var(--cream); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 4px 0 var(--ink); pointer-events: none; }
    #rotate { display: none; position: absolute; z-index: 5; bottom: calc(200px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 13px; }
    @media (orientation: portrait) { #rotate { display: block; } }
  </style>
</head>
<body class="sky">
  <div class="clouds"><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div></div>

  <div id="join">
    <div class="mascot"><div class="tread"></div><div class="body"></div><div class="barrel"></div><div class="turret"></div><div class="eye l"></div><div class="eye r"></div></div>
    <h1 class="title wobble">TANK ARENA</h1>
    <section class="panel join-card pop-in">
      <div class="panel-header">GABUNG ROOM</div>
      <div class="room-line">Room <span class="badge" id="room-code">-</span></div>
      <input class="input" id="name" maxlength="12" placeholder="Nama kamu" autocomplete="off" enterkeyhint="go" />
      <button class="btn" id="join-btn" disabled>🚀 MASUK</button>
      <div class="net-status"><span class="chip wait" id="chip-rtc">Langsung: ...</span><span class="chip wait" id="chip-relay">Relay: ...</span></div>
      <div id="msg">Menyiapkan koneksi...</div>
    </section>
  </div>

  <div id="game">
    <div class="topbar">
      <div class="avatar"></div>
      <span id="me-name">Kamu</span>
      <div class="hp"><div id="hp-fill"></div></div>
      <span id="life"><span class="heart"></span><span class="heart"></span><span class="heart"></span></span>
      <span id="pts">0</span>
      <span id="link">LANGSUNG</span>
    </div>
    <div id="round-pill" hidden></div>

    <section class="panel" id="lobby">
      <div class="panel-header">LOBBY</div>
      <p id="lobby-text">Menunggu host memulai game...</p>
      <div id="lobby-host">
        <div class="segs"><button class="seg" data-n="3">3</button><button class="seg" data-n="5">5</button><button class="seg" data-n="7">7</button></div>
        <button class="btn" id="start-btn">▶ MULAI GAME</button>
      </div>
    </section>

    <span class="badge" id="rotate">📱↻ Putar HP biar lebih enak</span>
    <div id="tip" hidden></div>
    <div id="big"></div>

    <div class="pad">
      <div class="stick move" id="left" data-label="JALAN"><div class="knob" id="left-knob"></div></div>
      <div class="stick attack" id="attack" data-label="GESER BIDIK · KETUK AUTO"><div class="knob" id="attack-knob"></div></div>
      <button class="action dash" id="dash"><span>DASH</span></button>
    </div>

    <div id="overlay"><div class="panel">
      <h2 class="title" id="overlay-title">KO!</h2>
      <p id="overlay-text"></p>
      <div id="overlay-extra"></div>
      <div class="btns" id="overlay-btns"><button class="btn" id="again-btn">🔁 MAIN LAGI</button><button class="btn blue" id="lobby-btn">🏠 LOBBY</button></div>
    </div></div>
  </div>

  <script src="vendor/peerjs.min.js?v=20261127b"></script>
  <script src="vendor/mqtt.min.js?v=20261127b"></script>
  <script src="net.js?v=20261127b"></script>
  <script src="touchpad.js?v=20261127b"></script>
  <script src="controller.js?v=20261127b"></script>
</body>
</html>
