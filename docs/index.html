<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Tank Arena</title>
  <link rel="stylesheet" href="style.css?v=20261127a" />
  <style>
    body { display: grid; place-items: center; min-height: 100%; padding: 32px 18px; overflow: hidden; }
    .menu { position: relative; z-index: 1; width: min(420px, 100%); text-align: center; }
    .title { font-size: clamp(54px, 15vw, 84px); }
    .tagline {
      display: inline-block; margin: 14px 0 18px; padding: 6px 14px;
      background: var(--ink); color: #fff; border-radius: 12px; font-weight: 700; font-size: 15px;
      transform: rotate(-2deg);
    }
    .card { padding: 34px 22px 22px; margin-top: 30px; }
    .buttons { display: grid; gap: 16px; }
    .btn small { display: block; font-family: var(--font-body); font-size: 13px; font-weight: 700; -webkit-text-stroke: 0; color: rgba(255,255,255,.92); letter-spacing: 0; }
    .btn .label { text-align: left; line-height: 1.05; }
    .tips { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .tip { font-size: 13px; font-weight: 700; background: #fff; border: 3px solid var(--ink); border-radius: 10px; padding: 4px 9px; }
    .footer { margin-top: 22px; color: #fff; font-weight: 700; font-size: 13px; text-shadow: 0 2px 0 var(--ink); }

    #game-shell { display: none; position: fixed; inset: 0; z-index: 5; place-items: center; background: var(--ink); }
    .solo-stage { position: relative; width: min(100vw, calc(100vh * 1000 / 700)); }
    .solo-stage canvas { display: block; width: 100%; height: auto; touch-action: none; }
    .solo-stage .ov { border-radius: 22px; }
    #pad { z-index: 7; }
    #back {
      position: fixed; z-index: 6; top: 10px; left: 10px; width: auto; padding: 8px 14px; font-size: 16px; display: none;
    }
  </style>
</head>
<body class="sky">
  <div class="clouds"><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div></div>

  <main class="menu" id="menu">
    <div class="pop-in">
      <div class="mascot"><div class="tread"></div><div class="body"></div><div class="barrel"></div><div class="turret"></div><div class="eye l"></div><div class="eye r"></div></div>
      <div class="mascot-shadow"></div>
    </div>
    <h1 class="title wobble">TANK<span class="alt">ARENA!</span></h1>
    <div class="tagline">Mabar pakai HP sebagai stik!</div>

    <section class="panel card pop-in" style="animation-delay:.1s">
      <div class="panel-header">PILIH MODE</div>
      <div class="buttons">
        <a class="btn" href="tv.html?mode=bot"><span class="icon">🤖</span><span class="label">SOLO VS BOT<small>Layar ini + scan QR, HP jadi stik</small></span></a>
        <a class="btn blue" href="tv.html"><span class="icon">📺</span><span class="label">MABAR + QR<small>2-4 HP jadi controller</small></span></a>
        <button class="btn purple" id="solo"><span class="icon">📱</span><span class="label">MAIN DI HP SAJA<small>Tanpa layar tambahan, lawan bot</small></span></button>
      </div>
      <div class="tips">
        <span class="tip">🕹️ Analog jalan</span>
        <span class="tip">🎯 Analog bidik</span>
        <span class="tip">💥 Tembak</span>
        <span class="tip">⚡ Dash</span>
        <span class="tip">❤️ 3 nyawa</span>
      </div>
    </section>
    <div class="footer">Maks 4 pemain · gratis di browser</div>
  </main>

  <button class="btn red" id="back">✖ MENU</button>
  <div id="game-shell"><div class="solo-stage" id="stage"><canvas id="game-canvas" width="1000" height="700"></canvas></div></div>
  <div class="pad" id="pad" hidden>
    <div class="stick move" id="left" data-label="JALAN"><div class="knob" id="left-knob"></div></div>
    <div class="stick attack" id="attack" data-label="GESER BIDIK · KETUK AUTO"><div class="knob" id="attack-knob"></div></div>
    <button class="action dash" id="dash"><span>DASH</span></button>
  </div>

  <script>
    // Layar penuh browser (dipicu klik pemain, jadi diizinkan). iPhone Safari tidak
    // mendukungnya untuk halaman biasa; di sana pakai "Tambah ke Layar Utama".
    function goFullscreen() {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
        try {
          const r = req.call(el);
          if (r && r.catch) r.catch(() => {});
        } catch (e) {
          // ditolak browser; abaikan
        }
      }
    }

    document.getElementById('solo').addEventListener('click', () => {
      goFullscreen();
      document.getElementById('menu').style.display = 'none';
      document.querySelector('.clouds').style.display = 'none';
      document.getElementById('game-shell').style.display = 'grid';
      document.getElementById('back').style.display = 'block';
      document.getElementById('game-canvas').id = 'game';
      const touchDevice = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
      document.getElementById('pad').hidden = !touchDevice;
      document.body.style.overflow = 'hidden';
      document.body.style.touchAction = 'none';
      const load = (src) => new Promise((ok) => { const s = document.createElement('script'); s.src = src; s.onload = ok; document.body.appendChild(s); });
      load('maps.js?v=20261127a').then(() => load('game.js?v=20261127a')).then(() => load('match.js?v=20261127a')).then(() => load('mapart.js?v=20261127a')).then(() => load('render.js?v=20261127a')).then(() => load('overlay.js?v=20261127a')).then(() => load('touchpad.js?v=20261127a')).then(() => load('solo.js?v=20261127a'));
    });
    document.getElementById('back').addEventListener('click', () => location.reload());
  </script>
</body>
</html>
