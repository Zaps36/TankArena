<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Tank Arena</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #17251c; color: #fff; font-family: system-ui, sans-serif; }
    body { display: grid; place-items: center; padding: 24px; overflow: hidden; position: relative; }
    body::before, body::after { content: ''; position: fixed; z-index: -1; border-radius: 50%; filter: blur(2px); opacity: .6; animation: floaty 7s ease-in-out infinite alternate; }
    body::before { width: 280px; height: 280px; top: -90px; left: -70px; background: #e67e22; border: 8px solid #271b17; }
    body::after { width: 220px; height: 220px; right: -50px; bottom: -55px; background: #3498db; border: 8px solid #142638; animation-delay: -2s; }
    .menu { width: min(440px, 100%); text-align: center; background: #fff4d6; color: #263126; border: 6px solid #252b25; border-radius: 28px; padding: 34px 24px; box-shadow: 0 12px 0 #111a13, 0 24px 60px #0008; animation: menu-bob 3s ease-in-out infinite; position: relative; }
    .menu::after { content: '★'; position: absolute; top: -30px; right: 28px; color: #f1c40f; font-size: 46px; -webkit-text-stroke: 4px #252b25; animation: spin-star 4s linear infinite; }
    h1 { margin: 0; color: #e67e22; letter-spacing: 5px; font-size: clamp(32px, 10vw, 58px); text-shadow: 4px 4px 0 #252b25; -webkit-text-stroke: 1px #252b25; }
    .subtitle { color: #536052; margin: 8px 0 30px; font-weight: 700; }
    button, a.button { display: block; width: 100%; border: 4px solid #252b25; border-radius: 16px; padding: 15px 18px; margin: 12px 0; color: white; font-size: 18px; font-weight: 800; text-decoration: none; cursor: pointer; box-shadow: 0 6px 0 #111a13; transition: transform .15s, box-shadow .15s; }
    button:hover, a.button:hover { transform: translateY(-3px) rotate(-1deg); box-shadow: 0 9px 0 #111a13; }
    button:active, a.button:active { transform: translateY(3px); box-shadow: 0 3px 0 #111a13; }
    #solo { background: #2ecc71; } #multi { background: #3498db; }
    .help { color: #536052; font-size: 13px; line-height: 1.5; margin-top: 24px; font-weight: 600; }
    #game { display: none; position: fixed; inset: 0; place-items: center; background: #111; }
    #game canvas { display: block; background: #9bd477; border: 6px solid #17251c; border-radius: 18px; box-sizing: border-box; width: min(100vw, calc(100vh * 1000 / 700)); height: auto; touch-action: none; }
    @keyframes floaty { from { transform: translate(0, 0) rotate(-8deg); } to { transform: translate(18px, 24px) rotate(8deg); } }
    @keyframes menu-bob { 0%, 100% { transform: translateY(0) rotate(-.4deg); } 50% { transform: translateY(-7px) rotate(.4deg); } }
    @keyframes spin-star { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="menu" id="menu">
    <h1>TANK ARENA</h1>
    <p class="subtitle">Arena shooter dengan kontrol HP</p>
    <button id="solo">MAIN SOLO VS BOT</button>
    <a class="button" id="multi" href="tv.html">BUKA LAYAR TV + QR CONTROLLER</a>
    <p class="help">Di mode TV, scan QR menggunakan HP. Analog kiri untuk jalan, analog kanan untuk arah tembak, tombol TEMBAK untuk menembak, dan DASH untuk melompat cepat.</p>
  </main>
  <div id="game-shell"><canvas id="game-canvas" width="1000" height="700"></canvas></div>
  <script>
    document.getElementById('solo').addEventListener('click', () => {
      document.getElementById('menu').style.display = 'none';
      document.getElementById('game-shell').style.display = 'grid';
      const canvas = document.getElementById('game-canvas');
      canvas.id = 'game';
      const gameScript = document.createElement('script');
      gameScript.src = 'game.js';
      gameScript.onload = () => {
        const soloScript = document.createElement('script');
        soloScript.src = 'solo.js';
        document.body.appendChild(soloScript);
      };
      document.body.appendChild(gameScript);
    });
  </script>
</body>
</html>
